# Shared VR-modding harness config.
#
# Copy this file to ~/.vr-harness.toml and edit the paths for your machine.
# Nothing machine-specific belongs in the repo, so this example is the only
# copy that is committed.
#
# Resolution order (first hit wins), see tools/vr_harness/__init__.py:
#   1. $VR_HARNESS_CONFIG
#   2. ~/.vr-harness.toml                    (WSL side)
#   3. $USERPROFILE/.vr-harness.toml         (Windows side, via wslpath)
#
# The file is deliberately project-keyed so the same config serves novr, bcvr
# and spvr: each project's tools read [tools.*] plus their own [projects.<name>]
# table. Adding a project here does not require touching any other repo.
#
# Windows paths are written in native form (backslashes, single-quoted TOML
# literal strings so the backslashes survive). The loader converts to WSL form
# with wslpath when a script needs to read a file directly.

[tools.renderdoc]
# Must contain renderdoccmd.exe. qrenderdoc.exe is only needed if you use the
# GUI; the harness drives the `rdc` CLI and renderdoccmd instead.
dir = 'C:\Program Files\RenderDoc'

[tools.harness]
# Windows-visible scratch space: RenderDoc captures, the staged OpenXR mock
# runtime, and anything else that must be readable by a Windows process.
# Must NOT be under \\wsl$ — Windows processes cannot reliably read that.
work_dir = 'C:\vr-harness'

[projects.novr]
game_dir = 'C:\Program Files (x86)\Steam\steamapps\common\Nuclear Option'
# Relative to game_dir. The harness launches this directly (via explorer.exe,
# see tools/vr_harness/game.py) rather than through Steam.
exe = 'NuclearOption.exe'
# Process name as Windows reports it (no .exe suffix) — used for kill/poll.
process_name = 'NuclearOption'
# Relative to game_dir.
plugin_dir = 'BepInEx/plugins/NOVR'
config_file = 'BepInEx/config/deltawing.novr.cfg'
# Unity writes this outside the game dir; the harness tails it to detect
# startup failures instead of waiting out the full timeout.
player_log = 'C:\Users\CHANGEME\AppData\LocalLow\Shockfront\NuclearOption\Player.log'

# Example of a second project sharing the same file — the novr tools ignore it.
# [projects.bcvr]
# game_dir = 'C:\Program Files (x86)\Steam\steamapps\common\Battleship Command'
# exe = 'Battleship Command.exe'
# process_name = 'Battleship Command'
# plugin_dir = 'BepInEx/plugins/BCVR'
# config_file = 'BepInEx/config/BCVR.cfg'
# player_log = 'C:\Users\CHANGEME\AppData\LocalLow\Cold Sun Games\Battleship Command\Player.log'
